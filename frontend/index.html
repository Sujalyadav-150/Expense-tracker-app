<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Expense Tracker</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div><span>AI POWERED</span><h1>Smart Expense Tracker</h1><p>Let AI understand your spending.</p></div><button id="insightBtn">✨ AI Spending Insight</button></header>
<section class="card"><h2>Add Expense</h2><form id="form"><input id="amount" type="number" min="1" step=".01" placeholder="Amount" required><input id="description" placeholder="e.g. Lunch at Domino's" required><select id="category"><option value="">🤖 Let AI choose</option><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option><option>Entertainment</option><option>Health</option><option>Education</option><option>Salary</option><option>Other</option></select><button>Add Expense</button></form><p id="msg"></p></section>
<section class="card"><div class="head"><h2>Your Expenses</h2><b id="total">Total: ₹0.00</b></div><div id="insight"></div><div id="list"></div></section></main><script src="script.js"></script></body></html>
